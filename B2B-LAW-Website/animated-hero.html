<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B2B LAW - المشهد المتحرك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #111114;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Amiri', serif;
      overflow: hidden;
      direction: rtl;
    }

    /* الخلفية المتحركة */
    .hero-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, rgba(212,168,83,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 30% 80%, rgba(212,168,83,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 60%, rgba(100,80,40,0.08) 0%, transparent 50%),
        #111114;
      z-index: 0;
    }

    /* جزيئات ذهبية متحركة */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(212, 168, 83, 0.3);
      pointer-events: none;
      animation: floatParticle linear infinite;
    }
    .particle:nth-child(1) { width: 4px; height: 4px; left: 10%; top: 20%; animation-duration: 12s; animation-delay: 0s; }
    .particle:nth-child(2) { width: 6px; height: 6px; left: 25%; top: 60%; animation-duration: 15s; animation-delay: 2s; background: rgba(212,168,83,0.15); }
    .particle:nth-child(3) { width: 3px; height: 3px; left: 40%; top: 30%; animation-duration: 10s; animation-delay: 1s; }
    .particle:nth-child(4) { width: 5px; height: 5px; left: 60%; top: 70%; animation-duration: 14s; animation-delay: 3s; background: rgba(212,168,83,0.2); }
    .particle:nth-child(5) { width: 3px; height: 3px; left: 75%; top: 25%; animation-duration: 11s; animation-delay: 0.5s; }
    .particle:nth-child(6) { width: 7px; height: 7px; left: 85%; top: 55%; animation-duration: 18s; animation-delay: 4s; background: rgba(212,168,83,0.1); }
    .particle:nth-child(7) { width: 4px; height: 4px; left: 50%; top: 15%; animation-duration: 13s; animation-delay: 1.5s; }
    .particle:nth-child(8) { width: 5px; height: 5px; left: 15%; top: 80%; animation-duration: 16s; animation-delay: 2.5s; }
    .particle:nth-child(9) { width: 3px; height: 3px; left: 70%; top: 40%; animation-duration: 9s; animation-delay: 3.5s; }
    .particle:nth-child(10) { width: 6px; height: 6px; left: 90%; top: 85%; animation-duration: 17s; animation-delay: 0.8s; background: rgba(212,168,83,0.12); }

    @keyframes floatParticle {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-120vh) translateX(30px); opacity: 0; }
    }

    .scene {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      padding: 40px;
    }

    .title {
      text-align: center;
      color: #fff;
    }
    .title h1 {
      font-family: 'Amiri', serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 700;
      color: #F3EDE5;
      line-height: 1.15;
    }
    .title h1 span {
      color: #D4A853;
    }
    .title p {
      font-family: 'Amiri', serif;
      font-size: 18px;
      color: rgba(243, 237, 229, 0.6);
      margin-top: 16px;
    }

    .devices {
      display: flex;
      align-items: center;
      gap: 40px;
      perspective: 1200px;
    }

    /* اللابتوب */
    .laptop {
      width: min(600px, 65vw);
      animation: floatLaptop 5s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    .laptop-body {
      position: relative;
      background: linear-gradient(145deg, #1E1E24, #2A2A32);
      border-radius: 16px;
      padding: 12px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.5),
        0 0 0 1px rgba(212,168,83,0.1);
      border-bottom: 6px solid #1A1A1E;
    }
    .laptop-screen {
      background: #0A0A0D;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/10;
      position: relative;
    }
    .laptop-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .laptop-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 6px;
      background: #0A0A0D;
      border-radius: 0 0 4px 4px;
    }
    .laptop-base {
      height: 18px;
      background: linear-gradient(180deg, #1E1E24, #16161A);
      border-radius: 0 0 12px 12px;
      position: relative;
    }
    .laptop-base::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: #2A2A32;
      border-radius: 0 0 4px 4px;
    }

    /* الجوال */
    .phone {
      width: min(200px, 22vw);
      animation: floatPhone 5.5s ease-in-out infinite;
      animation-delay: -2.5s;
      transform-style: preserve-3d;
    }
    .phone-body {
      background: linear-gradient(145deg, #1E1E24, #2A2A32);
      border-radius: 24px;
      padding: 8px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.5),
        0 0 0 1px rgba(212,168,83,0.1);
    }
    .phone-screen {
      background: #0A0A0D;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 9/19.5;
      position: relative;
    }
    .phone-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 20px;
      background: #0A0A0D;
      border-radius: 0 0 12px 12px;
    }

    @keyframes floatLaptop {
      0%, 100% { transform: translateY(0) rotateX(1deg); }
      50% { transform: translateY(-16px) rotateX(-1deg); }
    }
    @keyframes floatPhone {
      0%, 100% { transform: translateY(0) rotateY(-2deg) rotateX(1deg); }
      50% { transform: translateY(-12px) rotateY(2deg) rotateX(-1deg); }
    }

    /* توهج خلف الأجهزة */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,168,83,0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    @media (max-width: 768px) {
      .devices { flex-direction: column; gap: 30px; }
      .phone { width: min(160px, 40vw); }
    }
  </style>
</head>
<body>
  <div class="hero-bg">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="scene">
    <div class="title">
      <h1>منصة <span>B2B LAW</span> الشاملة</h1>
      <p>أدر قضاياك، موكلينك، وجلساتك في منصة واحدة ذكية وآمنة</p>
    </div>

    <div class="devices">
      <div class="glow"></div>

      <!-- اللابتوب -->
      <div class="laptop">
        <div class="laptop-body">
          <div class="laptop-screen">
            <div class="laptop-notch"></div>
            <img src="./images/hero-dashboard.png" alt="B2B LAW Dashboard" loading="lazy">
          </div>
          <div class="laptop-base"></div>
        </div>
      </div>

      <!-- الجوال -->
      <div class="phone">
        <div class="phone-body">
          <div class="phone-screen">
            <div class="phone-notch"></div>
            <img src="./images/feature-clients.jpg" alt="B2B LAW Mobile" loading="lazy">
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
