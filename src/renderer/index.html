<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2B-LAW برنامج المحامي الاحترافي</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: file: blob: https://ui-avatars.com; connect-src 'self' ws: http://localhost:5173 http://localhost:54226 https://b2b-law-g2qr.onrender.com;"
    />
    <script>
      if (typeof window.api === 'undefined') {
        const genericMock = {
          auth: {
            login: (u, p) =>
              Promise.resolve({ username: u || 'admin', roleKey: 'admin', permissions: [] }),
            getSession: () =>
              Promise.resolve(JSON.parse(localStorage.getItem('web_currentUserSession') || 'null')),
            logout: () => Promise.resolve(true)
          },
          vault: {
            needsSetup: () => Promise.resolve({ needsSetup: false })
          }
        }

        window.api = new Proxy(genericMock, {
          get(target, prop) {
            if (prop in target) return target[prop]
            return new Proxy(
              {},
              {
                get(_, subProp) {
                  return (...args) => {
                    console.log(
                      `[Mock API Call] ${String(prop)}.${String(subProp)} called with:`,
                      args
                    )
                    return Promise.resolve([])
                  }
                }
              }
            )
          }
        })
        console.warn('Electron API (Head Proxy Mock) enabled for browser/testing environment')
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
