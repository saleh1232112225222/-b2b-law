<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>B2B-LAW Mobile Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
  }
  .phone-frame {
    width: 393px;
    height: 852px;
    background: #000;
    border-radius: 44px;
    padding: 12px;
    box-shadow: 0 0 60px rgba(0,150,255,0.15), 0 0 120px rgba(0,100,200,0.08);
    position: relative;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 32px;
    overflow: hidden;
    background: #fff;
    position: relative;
  }
  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 30px;
    background: #000;
    border-radius: 0 0 18px 18px;
    z-index: 10;
  }
  .phone-notch::after {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: #1a1a3a;
    border-radius: 50%;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    padding: 8px 20px 0;
    font-size: 11px;
    color: #fff;
    background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
    pointer-events: none;
  }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .controls button {
    padding: 8px 20px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
  }
  .controls button.active,
  .controls button:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }
  .info {
    text-align: center;
    margin-top: 16px;
    color: #555;
    font-size: 12px;
  }
  .info a { color: #4a9eff; text-decoration: none; }
  .orientation-badge {
    display: inline-block;
    background: rgba(255,255,255,0.06);
    padding: 4px 14px;
    border-radius: 12px;
    font-size: 11px;
    color: #777;
    margin-top: 8px;
  }
  .device-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
  }
  .device-btn {
    padding: 6px 14px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    background: transparent;
    color: #666;
    font-size: 12px;
    cursor: pointer;
  }
  .device-btn.active {
    border-color: #4a9eff;
    color: #4a9eff;
    background: rgba(74,158,255,0.08);
  }
</style>
</head>
<body>
<div>
  <div class="phone-frame" id="phoneFrame">
    <div class="phone-screen">
      <div class="phone-notch"></div>
      <div class="status-bar">
        <span>9:41</span>
        <span>🔋 94%</span>
      </div>
      <iframe id="appFrame" src="http://localhost:5173" loading="lazy"></iframe>
    </div>
  </div>
  <div class="controls">
    <button onclick="setDevice('iPhone 15 Pro', 393, 852)">📱 iPhone 15 Pro</button>
    <button onclick="setDevice('Pixel 8', 412, 915)" class="active">📱 Pixel 8</button>
    <button onclick="setDevice('Galaxy S24', 360, 780)">📱 Galaxy S24</button>
    <button onclick="setDevice('iPad Mini', 744, 1133)">📱 iPad Mini</button>
  </div>
  <div class="device-selector" id="deviceLabels">
    <span class="device-btn active">Portrait</span>
    <span class="device-btn" onclick="toggleOrientation()">Landscape</span>
  </div>
  <div class="info">
    🔄 تحميل التطبيق داخل محاكي جوال | 
    <a href="http://localhost:5173" target="_blank">فتح في المتصفح</a>
    <br>
    <span class="orientation-badge" id="deviceInfo">Pixel 8 · 412×915 · CSS pixels</span>
  </div>
</div>
<script>
  function setDevice(name, w, h) {
    const frame = document.getElementById('phoneFrame');
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
    document.getElementById('deviceInfo').textContent = name + ' · ' + w + '×' + h + ' · CSS pixels';
    document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }
  let portrait = true;
  function toggleOrientation() {
    portrait = !portrait;
    const frame = document.getElementById('phoneFrame');
    const w = frame.style.width;
    const h = frame.style.height;
    frame.style.width = h;
    frame.style.height = w;
    document.querySelectorAll('.device-btn').forEach(b => b.classList.toggle('active'));
    document.getElementById('deviceInfo').textContent += ' (' + (portrait ? 'Portrait' : 'Landscape') + ')';
  }
</script>
</body>
</html>
