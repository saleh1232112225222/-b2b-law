name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: Lint & Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cloud-server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix cloud-server ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint backend
        run: npm --prefix cloud-server run lint
        continue-on-error: true

      - name: Unit tests
        run: npx vitest run

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests (Playwright)
        run: npm run test:e2e
        continue-on-error: true
        timeout-minutes: 10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: test-*.png
          retention-days: 3

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cloud-server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix cloud-server ci

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npm --prefix cloud-server run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/web
          retention-days: 1

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL || '' }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist/web

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: dist/web
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy backend to Render (deploy hook)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Deploy backend to Render (API fallback)
        if: env.RENDER_API_KEY != '' && env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          curl -X POST "https://api.render.com/v1/services/srv-d8hja5ldt1ts73ae0k70/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
