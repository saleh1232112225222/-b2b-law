services:
  db:
    image: postgres:16-alpine
    container_name: b2b-law-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: b2b_law
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: b2b_law_db
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b2b_law -d b2b_law_db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./cloud-server
      dockerfile: Dockerfile
    container_name: b2b-law-backend
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgresql://b2b_law:${DB_PASSWORD:-change-me-in-production}@db:5432/b2b_law_db
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_BOOTSTRAP_HASH: ${ADMIN_BOOTSTRAP_HASH:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@b2blaw.local}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: b2b-law-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
